service: serverless-arazzo-doc-demo
frameworkVersion: "3.40.0"
provider:
  name: aws
  runtime: nodejs20.x

plugins:
  - serverless-openapi-documenter
  - ../../index.js

functions:
  addPet:
    handler: handler.createPet
    events:
      - http:
          path: /pet
          method: post
          documentation:
            summary: Add a new pet to the store
            tags:
              - pet
            requestBody:
              description: Pet object that needs to be added to the store
              required: true
            requestModels:
              application/json: Pet
              application/xml: Pet
            methodResponses:
              - statusCode: 405
                responseBody:
                  description: Invalid input
          arazzo:
            workflows:
              - workflowName: AddAPet
                stepId: AddApet
                stepNumber: 1
                requestBody:
                  contentType: application/json
                  payload: $inputs.addPet
                outputs:
                  petId: $response.body#/id
      - sqs:
          arn: abc
          enabled: true
  updatePet:
    handler: handler.updatePet
    events:
      - http:
          path: /pet
          method: put
          documentation:
            summary: Update an existing pet
            tags:
              - pet
            requestBody:
              description: Pet object that needs to be added to the store
              required: true
            requestModels:
              application/json: Pet
              application/xml: Pet
            methodResponses:
              - statusCode: 400
                responseBody:
                  description: Invalid ID supplied
              - statusCode: 404
                responseBody:
                  description: Pet not found
              - statusCode: 405
                responseBody:
                  description: Validation exception

  findPetsByTags:
    handler: handler.findPetsByTags
    events:
      - http:
          path: /pet/findByTags
          method: get
          documentation:
            deprecated: true
            summary: Finds Pets by tags
            description: Muliple tags can be provided with comma separated strings. Use tag1, tag2, tag3 for testing.
            tags:
              - pet
            queryParams:
              - name: tags
                description: Tags to filter by
                required: true
                explode: true
                schema:
                  type: array
                  items:
                    type: string
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: successful operation
                responseModels:
                  application/json: PetArray
                  application/xml: PetArray
              - statusCode: 400
                responseBody:
                  description: Invalid tag value

  getPetById:
    handler: handler.getPetById
    events:
      - http:
          path: /pet/{petId}
          method: get
          documentation:
            summary: Find pet by ID
            description: Returns a single pet
            tags:
              - pet
            pathParams:
              - name: petId
                description: ID of pet to return
                required: true
                schema:
                  type: integer
                  format: int64
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: successful operation
                responseModels:
                  application/json: Pet
                  application/xml: Pet
              - statusCode: 400
                responseBody:
                  description: Invalid ID supplied
              - statusCode: 404
                responseBody:
                  description: Pet not found
          arazzo:
            workflows:
              - workflowName: AddAPet
                stepId: GetPetById
                stepNumber: 2
                parameters:
                  - name: petId
                    in: path
                    value: $steps.AddAPet.outputs.petId


  updatePetWithForm:
    handler: handler.updatePetWithForm
    events:
      - http:
          path: /pet/{petId}
          method: post
          documentation:
            summary: Updates a pet in the store with form data
            tags:
              - pet
            pathParams:
              - name: petId
                description: ID of pet to return
                required: true
                schema:
                  type: integer
                  format: int64
            requestBody:
              description:
            requestModels:
              application/x-www-form-urlencoded: PetForm
            methodResponses:
              - statusCode: 405
                responseBody:
                  description: Invalid input

  deletePet:
    handler: handler.deletePet
    events:
      - http:
          path: /pet/{petId}
          method: delete
          documentation:
            summary: Deletes a pet
            tags:
              - pet
            pathParams:
              - name: petId
                description: ID of pet to return
                required: true
                schema:
                  type: integer
                  format: int64
            headerParams:
              - name: api_key
                required: false
                schema:
                  type: string
            methodResponses:
              - statusCode: 400
                responseBody:
                  description: Invalid ID supplied
              - statusCode: 404
                responseBody:
                  description: Pet not found

  uploadFile:
    handler: handler.uploadFile
    events:
      - http:
          path: /pet/{petId}/uploadImage
          method: post
          documentation:
            summary: uploads an image
            tags:
              - pet
            pathParams:
              - name: petId
                description: ID of pet to return
                required: true
                schema:
                  type: integer
                  format: int64
            requestBody:
              description:
            requestModels:
              application/octet-stream: UploadForm
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: successful operation
                responseModels:
                  application/json: UploadedFile

custom:
  arazzo:
    info:
      description: This is an example of an Arazzo Specification
      summary: Example Arazzo Specification
      version: 1.0.0
    workflows:
      - workflowName: AddAPet
        workflowId: AddAPet
        sumamry: Add a pet to the database
        description: Add a pet to the database and then check that it is there
        inputs:
          type: object
          properties:
            addPet:
              type: object
              properties:
                name:
                  type: string
                photoURLs:
                  type: array
                  items:
                    type: string


    # workflows:
