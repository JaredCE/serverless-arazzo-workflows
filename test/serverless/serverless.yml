  documentation:
    description: |
      This is a sample server Petstore server.  You can find out more about Swagger at [http://swagger.io](http://swagger.io) or on [irc.freenode.net, #swagger](http://swagger.io/irc/).  For this sample, you can use the api key `special-key` to test the authorization filters.
    version: 1.0.0
    title: Swagger Petstore
    termsOfService: http://swagger.io/terms/
    contact:
      email: apiteam@swagger.io
    license:
      name: Apache 2.0
      url: http://www.apache.org/licenses/LICENSE-2.0.html
    servers:
      url: http://petstore.swagger.io/v2
    externalDocumentation:
      description: Find out more about Swagger
      url: http://swagger.io
    tags:
      - name: pet
        description: Everything about your Pets
        externalDocumentation:
          url: http://swagger.io
          description: Find out more
      - name: store
        description: Access to Petstore orders
      - name: user
        description: Operations about user
        externalDocumentation:
          description: Find out more about our store
          url: http://swagger.ios
    models:
      - name: Pet
        content:
          application/json:
            schema: &PetSchema
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  readOnly: true
                category:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                  xml:
                    name: Category
                name:
                  type: string
                  example: doggie
                photoUrls:
                  type: array
                  items:
                    type: string
                  xml:
                    name: photoUrl
                    wrapped: true
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      name:
                        type: string
                    xml:
                      name: Tag
                  xml:
                    name: tag
                    wrapped: true
                status:
                  type: string
                  description: pet status in the store
                  enum:
                    - available
                    - pending
                    - sold
              required:
                - name
                - photoUrls
              xml:
                name: Pet
          application/xml:
            schema:
              *PetSchema
      - name: PetArray
        content:
          application/json:
            schema:
              type: array
              items:
                *PetSchema
          application/xml:
            schema:
              type: array
              items:
                *PetSchema
      - name: PetForm
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated name of the pet
                status:
                  type: string
                  description: Updated status of the pet
      - name: UploadedFile
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                type:
                  type: string
                message:
                  type: string
      - name: UploadForm
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
